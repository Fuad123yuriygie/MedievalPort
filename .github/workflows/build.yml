name: Build And Test

on:
  push:
    branches: [main, master]
  pull_request: {}

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux graphics dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMEDIEVALPORT_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test CPU systems
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: medievalport-build-${{ runner.os }}
          path: build
