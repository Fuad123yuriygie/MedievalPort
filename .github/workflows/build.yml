name: Build And Test

on:
  push:
    branches: [main, master]
  pull_request: {}

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Linux graphics dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMEDIEVALPORT_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test CPU systems
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: medievalport-build-${{ runner.os }}
          path: build

  graphics:
    # Compilation and CPU tests alone cannot catch driver-facing regressions in resource setup,
    # rendering or pass state. This job runs the OpenGL suite against a headless Mesa software
    # rasterizer, which supports the required 4.5 core profile.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install headless graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libgl1-mesa-dri mesa-utils \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev xvfb
      - name: Configure
        run: cmake -S . -B build-gl -DCMAKE_BUILD_TYPE=Release -DMEDIEVALPORT_ENABLE_GL_TESTS=ON -DMEDIEVALPORT_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-gl --config Release --parallel 2
      - name: Test OpenGL systems headless
        run: xvfb-run -a -s "-screen 0 1280x720x24" env LIBGL_ALWAYS_SOFTWARE=1 ctest --test-dir build-gl -C Release --output-on-failure -L OpenGL --no-tests=error
